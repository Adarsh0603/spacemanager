[package]
name = "space-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
jwalk = "0.9.0"
rfd = "0.17.2"
trash = "5.2.9"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "space-manager-gui"
path = "src/bin/gui.rs"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
